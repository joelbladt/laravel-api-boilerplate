name: tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [ '8.3', '8.4' ]
        phpunit: [ '12.1', '12.2' ]
        paratest: [ '7.8', '7.9', '7.10' ]
        phpstan: [ '2.1' ]
        larastan: [ 'v3.5' ]

    name: PHP ${{ matrix.php }} - PHPUnit ${{ matrix.phpunit }} - ParaTest ${{ matrix.paratest }} - PHPStan ${{ matrix.phpstan }} - Larastan ${{ matrix.larastan }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, redis, igbinary, msgpack, lzf, zstd, lz4, memcached, gmp, xml, xdebug, :php-psr
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none
          cache: composer
        env:
          REDIS_CONFIGURE_OPTS: --enable-redis --enable-redis-igbinary --enable-redis-msgpack --enable-redis-lzf --with-liblzf --enable-redis-zstd --with-libzstd --enable-redis-lz4 --with-liblz4
          REDIS_LIBS: liblz4-dev, liblzf-dev, libzstd-dev

      - name: Set minimum framework dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require guzzlehttp/psr7:^2.4 --no-interaction --no-update

      - name: Set PHPUnit
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require phpunit/phpunit:^${{ matrix.phpunit }} --dev --no-interaction --no-update

      - name: Set ParaTest
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require brianium/paratest:^${{ matrix.paratest }} --dev --no-interaction --with-all-dependencies

      - name: Set PHPStan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require phpstan/phpstan:^${{ matrix.phpstan }} --dev --no-interaction --no-update

      - name: Set Larastan
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require larastan/larastan:^${{ matrix.larastan }} --dev --no-interaction --no-update

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Execute tests
        run: php artisan test --parallel --configuration="phpunit.xml.dist"
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Execute PHPStan
        run: vendor/bin/phpstan --configuration="phpstan.neon.dist"

  coverage:
    runs-on: ubuntu-latest
    name: Coverage upload (PHP 8.4)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, xml, xdebug
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: xdebug
          cache: composer

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer install --prefer-dist --no-interaction --no-progress

      - name: Execute tests with coverage
        run: php artisan test --parallel --configuration="phpunit.xml.dist" --coverage-clover=build/logs/clover.xml
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Upload coverage results to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          composer global require php-coveralls/php-coveralls
          php-coveralls --coverage_clover=build/logs/clover.xml -v
